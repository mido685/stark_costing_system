[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
version_path_separator = os

# The URL is assembled from DB_* environment variables in alembic/env.py.
# Keeping credentials out of this committed file prevents accidental exposure.
sqlalchemy.url = postgresql+psycopg2://

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
